<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Minecraft 1.8</title>

    <link rel="stylesheet" href="css/minecraft.css">

</head>

<body>

    <div id="panorama">

        <div id="cube">

            <div class="face front"></div>
            <div class="face back"></div>
            <div class="face right"></div>
            <div class="face left"></div>
            <div class="face top"></div>
            <div class="face bottom"></div>

        </div>

    </div>
    
   <div id="menu">

    <img
        id="logo"
        src="images/gui/minecraft_logo.png"
        alt="Minecraft"
    >

    <div id="splash">missingno</div>

    <div id="buttons">

        <div class="mc-button">
            Singleplayer
        </div>

        <div class="mc-button">
            Multiplayer
        </div>

        <div class="mc-button">
            Minecraft Realms
        </div>

        <div id="buttonRow">

            <div class="mc-button half">
                Options...
            </div>

            <div class="mc-button half">
                Quit Game
            </div>

        </div>

    </div>

    <div id="version">
        Minecraft 1.8
    </div>

    <div id="copyright">
        Copyright Mojang AB. Do not distribute!
    </div>

</div>
    
    <audio id="menuMusic"></audio>

    <script src="js/script.js"></script>

</body>

</html>
