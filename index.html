<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Minecraft 1.8</title>

    <link rel="stylesheet"
          href="css/minecraft.css">

</head>

<body>

    <!-- ========================= -->
    <!-- Panorama                  -->
    <!-- ========================= -->

    <div id="panorama">

        <div id="cube">

            <div class="face front"></div>
            <div class="face back"></div>
            <div class="face right"></div>
            <div class="face left"></div>
            <div class="face top"></div>
            <div class="face bottom"></div>

        </div>

    </div>


    <!-- ========================= -->
    <!-- GUI                       -->
    <!-- ========================= -->

    <div id="gui">

        <!-- Logo -->

        <img
            id="logo"
            src="images/gui/minecraft_logo.png"
            alt="Minecraft">


        <!-- Splash -->

        <div id="splash">

            missingno

        </div>


        <!-- Main Menu -->

        <div id="menu">

            <div class="mc-button"
                 id="singleplayer">

                Singleplayer

            </div>


            <div class="mc-button"
                 id="multiplayer">

                Multiplayer

            </div>


            <div class="mc-button"
                 id="realms">

                Minecraft Realms

            </div>


            <div id="bottomButtons">

                <div class="mc-button half"
                     id="options">

                    Options...

                </div>


                <div class="mc-button half"
                     id="quit">

                    Quit Game

                </div>

            </div>

        </div>


        <!-- Bottom Left -->

        <div id="version">

            Minecraft 1.8

        </div>


        <!-- Bottom Right -->

        <div id="copyright">

            Copyright Mojang AB. Do not distribute!

        </div>

    </div>


    <!-- ========================= -->
    <!-- Audio                      -->
    <!-- ========================= -->

    <audio id="menuMusic"></audio>

    <audio id="clickSound">

        <source
            src="sounds/click.ogg"
            type="audio/ogg">

    </audio>


    <!-- ========================= -->
    <!-- JavaScript                 -->
    <!-- ========================= -->

    <script src="js/panorama.js"></script>

    <script src="js/gui.js"></script>

    <script src="js/audio.js"></script>

    <script src="js/splash.js"></script>

    <script src="js/main.js"></script>

</body>

</html>
